<header th:fragment="header">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">

        <!-- Brand Logo -->
        <a th:href="@{/}" class="header-brand-link">
            <img th:src="@{/img/logo/nest_logo.png}" alt="NEST Logo" class="header-brand-image">
            <span class="header-brand-text">NEST 시스템</span>
        </a>


        <!-- SEARCH FORM -->
        <form class="form-inline ml-3">
            <div class="input-group input-group-sm">
                <input class="form-control form-control-navbar" type="search" placeholder="Search" aria-label="Search">
                <div class="input-group-append">
                    <button class="btn btn-navbar" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </form>

        <!-- Right navbar links -->
        <ul class="navbar-nav ml-auto">
            <!-- Notifications Dropdown Menu -->
            <li class="nav-item dropdown">
                <a class="nav-link" data-toggle="dropdown" href="#">
                    <i class="far fa-bell"></i>
                    <span class="badge badge-warning navbar-badge">3</span>
                </a>
                <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
                    <span class="dropdown-header">3 Notifications</span>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item">
                        <i class="fas fa-envelope mr-2"></i> 1 new message
                        <span class="float-right text-muted text-sm">3 mins</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item dropdown-footer">See All Notifications</a>
                </div>
            </li>

            <!-- User Dropdown -->
            <li class="nav-item dropdown">
                <a class="nav-link" data-toggle="dropdown" href="#">
                    <img th:src="@{/img/user2-160x160.jpg}" alt="User" class="img-circle" style="width:28px; height:28px;">
                    <span class="ml-2">관리자</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right">
                    <a href="/mypage" class="dropdown-item">마이페이지</a>
                    <div class="dropdown-divider"></div>
                    <a href="/logout" class="dropdown-item">로그아웃</a>
                </div>
            </li>
        </ul>
    </nav>
</header>
