<!-- fragments/calendar-modal.html -->
<div th:fragment="calendarModalFragment">
  <div id="calendarModal" class="modal"
       style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000;">
    <div style="background:white; padding:20px; margin:5% auto; width:1000px; border-radius:8px; position:relative;">
      <h4>📅 달력</h4>

      <!-- 📆 달력 -->
      <div id="calendar" style="margin-bottom: 20px;"></div>

      <!-- 🔍 메모 검색창 -->
      <div class="memo-search-bar" style="margin-top: 20px; position: relative;">
        <input type="date" id="searchFromDate" placeholder="From" />
        <input type="date" id="searchToDate" placeholder="To" />
        <input type="text" id="searchWriterName" placeholder="작성자" />
        <input type="text" id="searchKeyword" placeholder="내용" oninput="handleAutoComplete(this.value)" />
        <button onclick="handleSearchMemo()">검색</button>

        <!-- 🔽 자동완성 리스트 -->
        <ul id="autocompleteList"
            style="display:none; position:absolute; top:100%; left:0; background:white; color:#333; border:1px solid #ccc; width:100%; z-index:3000;"></ul>

      </div>

      <!-- 📋 검색 결과 리스트 -->
      <div id="memoSearchList" style="margin-top: 10px;"></div>

      <!-- 📝 메모 작성 영역 (우측 확장 가능) -->
      <div id="memoModal" class="memo-modal" style="display: none;">
        <div class="memo-modal-content" style="border: 1px solid #ddd; padding: 15px; margin-top: 20px; position: relative;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="memoDateDisplay">선택한 날짜 <span id="editingBadge" style="color:crimson; font-size: 0.8em;"></span></h3>
            <div>
              <button id="toggleMemoExpand" type="button">↔ 확장</button>
              <button id="memoCancelBtn" type="button">취소</button>
              <button class="memo-close-btn" id="memoCloseBtn" type="button">&times;</button>
            </div>
          </div>
          <textarea id="memoText"
                    placeholder="메모를 입력하세요..."
                    style="width:100%; height:120px; resize: vertical; overflow-y: auto;"></textarea>
          <div class="memo-modal-actions" style="margin-top: 10px;">
            <button id="memoSaveBtn">저장</button>
          </div>
          <div id="memoListArea" style="margin-top: 20px;"></div>
        </div>
      </div>

      <!-- 닫기 버튼 -->
      <div style="text-align:right; margin-top: 30px;">
        <button onclick="document.getElementById('calendarModal').style.display='none'">닫기</button>
      </div>
    </div>
  </div>
</div>
