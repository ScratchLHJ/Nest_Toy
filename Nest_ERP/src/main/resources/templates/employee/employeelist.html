<div th:fragment="content">
    <div class="container-fluid">
        <h3 class="mt-3">인사관리대장</h3>

        <!-- 🔍 검색 필터 영역 -->
        <form method="get" action="/employee" class="row g-2 align-items-end mb-4">
            <div class="col-md-3">
                <label for="branchId" class="form-label">지점</label>
                <select id="branchId" name="branchId" class="form-select">
                    <option th:value="" selected>전체 지점</option>
                    <option th:each="b : ${branches}"
                            th:value="${b.branchId}"
                            th:text="${b.branchName}"
                            th:selected="${param.branchId != null and b.branchId.toString() == param.branchId}">
                    </option>

                </select>
            </div>
            <div class="col-md-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" id="name" name="name" class="form-control" th:value="${param.name}">
            </div>
            <div class="col-md-3">
                <label for="employmentType" class="form-label">고용형태</label>
                <input type="text" id="employmentType" name="employmentType" class="form-control" th:value="${param.employmentType}">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary">검색</button>
            </div>
        </form>

        <!-- 📋 직원 목록 테이블 -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr>
                    <th>이름</th>
                    <th>고용형태</th>
                    <th>연락처</th>
                    <th>지점</th>
                    <th>직급</th>
                    <th>위촉일</th>
                    <th>해촉일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employeeList}">
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.employmentType}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.branchName}"></td>
                    <td th:text="${emp.position}"></td>
                    <td th:text="${#temporals.format(emp.startDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${#temporals.format(emp.endDate, 'yyyy-MM-dd')}"></td>
                </tr>
                <tr th:if="${employeeList.size()} == 0">
                    <td colspan="7" class="text-center">직원 정보가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
